name: Release Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [ "1.20.1-fabric" ]

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version info from gradle.properties
        id: versions
        run: |
          MOD_VERSION=$(grep -oP 'mod_version\s*=\s*\K.+' gradle.properties || echo "unknown")
          MC_VERSION=$(grep -oP 'minecraft_version\s*=\s*\K.+' gradle.properties || echo "1.20.1")
          echo "MOD_VERSION=$MOD_VERSION" >> $GITHUB_ENV
          echo "MC_VERSION=$MC_VERSION" >> $GITHUB_ENV
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache Gradle (improved key)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean previous builds and Loom cache
        run: |
          ./gradlew clean --no-daemon || true
          rm -rf ~/.gradle/caches/fabric-loom || true

      - name: Build Fabric mod
        run: ./gradlew build --stacktrace --no-daemon

      - name: Find remapped release JAR (exclude dev/sources/etc)
        id: find-jar
        run: |
          set -e
          echo "Listing build/libs contents:"
          ls -la build/libs/ || true

          JAR_FILE=$(find build/libs -maxdepth 1 -type f \
            -name "*${{ env.MOD_VERSION }}*.jar" \
            ! -name "*-dev*.jar" \
            ! -name "*-sources*.jar" \
            ! -name "*-javadoc*.jar" \
            ! -name "*-all*.jar" \
            ! -name "*shadow*.jar" \
            | sort | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: No remapped JAR found. Possible reasons:"
            echo "1. remapJar task did not run or failed silently"
            echo "2. Naming convention different from expected"
            echo "Check previous logs for :remapJar task output"
            exit 1
          fi

          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Selected release JAR: $JAR_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOD_VERSION }}
          name: v${{ env.MOD_VERSION }} (${{ env.MC_VERSION }} Fabric)
          body: |
            **Minecraft ${{ env.MC_VERSION }} Fabric**
            
            Auto-generated release from branch 1.20.1-fabric
          files: ${{ steps.find-jar.outputs.jar_file }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-modrinth:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Publish to Modrinth
        run: ./gradlew modrinth --no-daemon
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

  publish-curseforge:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment: Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Publish to CurseForge
        run: ./gradlew curseforge --no-daemon
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}